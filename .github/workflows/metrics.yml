name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Wittelsbach-Konig
          template: classic
          filename: github-metrics.svg
          committer_branch: metrics-data
          config_timezone: Europe/Moscow
